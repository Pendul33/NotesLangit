name: Build Notes Langit APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir build-src
          unzip -q NotesLangit-CloudBuild-1.zip -d build-src

      - name: Build APK
        working-directory: build-src
        run: |
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NotesLangit-debug-apk
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
